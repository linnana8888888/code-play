# Agent Roster Configuration
# Maps agent IDs to their model routing and tool access.
#
# Approved model set (LEGO proxy + local + OpenRouter stealth, as of 2026-04-17):
#   - omlx/Qwen3.5-9B-MLX-4bit                                  (local, free)
#   - anthropic/anthropic.claude-opus-4-7                       (reasoning, $$$)
#   - anthropic/anthropic.claude-sonnet-4-6                     (balanced)
#   - anthropic/anthropic.claude-haiku-4-5-20251001-v1:0        (cheap)
#   - openai/gpt-5-2025-08-07                                   (reasoning, via LEGO)
#   - openrouter/openrouter/elephant-alpha                      (stealth/cloaked, free tier)
#
# OpenRouter format: first `openrouter/` is our router prefix, second is OR's model namespace.
# Only use OpenRouter for stealth/experimental models not available via LEGO proxy.
#
# Tools:
#   `tools: [builtin]`               → every builtin + pre_approved tool (parity with Claude Code).
#   `tools: [builtin, git_push, ..]` → builtins plus one or more restricted extras (still gated).
#   `tools: [file_read, channel_post, ...]` → explicit subset (no builtin expansion).

defaults:
  model: "omlx/Qwen3.5-9B-MLX-4bit"
  fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
  temperature: 0.7
  max_tokens: 4096
  budget_max_tokens: 200000    # 200k tokens per agent run
  budget_max_usd: 1.00         # $1 per agent run (relevant for paid models)

agents:
  # Game Development Core
  game-designer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Systems and mechanics architect (GPT-5 for reasoning)"
    tools: [builtin]

  narrative-designer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Story systems and dialogue architect"
    tools: [builtin]

  level-designer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Spatial storytelling and flow specialist"
    tools: [builtin]

  game-audio-engineer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Interactive audio specialist"
    tools: [builtin]

  technical-artist:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Art-to-engine pipeline specialist (GPT-5 for visual/logic judgment)"
    tools: [builtin]

  # Engineering
  frontend-developer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Three.js/WebGL implementation specialist (GPT-5 primary codegen)"
    tools: [builtin]

  code-reviewer:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Code quality and security reviewer"
    tools: [builtin]

  backend-architect:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Backend and API design"
    tools: [builtin]

  devops-automator:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "CI/CD and deployment specialist"
    # git_push is restricted — devops can request it and the approval queue gates it.
    tools: [builtin, git_push]

  security-engineer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Application security specialist"
    tools: [builtin]

  # Roblox
  roblox-systems-scripter:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox Luau scripting specialist"
    tools: [builtin]

  roblox-experience-designer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox engagement and monetization specialist"
    tools: [builtin]

  roblox-avatar-creator:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox UGC / avatar pipeline specialist — rigging, Classic + Layered Clothing, Creator Marketplace submission"
    tools: [builtin]

  # Testing
  qa-engineer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Playtest web games against the mechanics spec using a headless browser"
    tools: [builtin, playwright_browser]

  # Research
  style-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Research visual style references from live Roblox/web games"
    tools: [builtin]

  mechanic-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Teardown popular games → actionable mechanic steal-list for ideation before concept lock"
    tools: [builtin]

  # Engineering leadership
  tech-lead:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Picks engine/stack/module layout for the build step before implementation"
    tools: [builtin]

  # Local model agents (when you want to save costs)
  local-assistant:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "General assistant running on local oMLX"
    tools: [builtin]

  # Stealth/experimental — OpenRouter cloaked models for benchmarking
  stealth-experiment:
    model: "openrouter/openrouter/elephant-alpha"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Stealth model (elephant-alpha) for experiments and benchmarking"
    tools: [builtin]

  # Design (imported from agency-agents — P0 batch, 2026-04-18)
  design-ui-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Visual UI systems, component libraries, pixel-perfect interface creation"
    tools: [builtin]

  design-ux-architect:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Onboarding flows, meta-loops, information architecture, navigation models"
    tools: [builtin]

  design-ux-researcher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Playtest interviews, heuristic evaluation, NPS driver analysis"
    tools: [builtin]

  design-whimsy-injector:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Polish/joy specialist — delight moments, micro-interactions, play tone"
    tools: [builtin]

  # Production (imported from agency-agents — P0 batch)
  project-management-studio-producer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Senior producer — owns human-gates, resource allocation, cross-project orchestration"
    tools: [builtin]

  project-management-project-shepherd:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Unblocks cross-agent dependencies and shepherds tasks through the queue"
    tools: [builtin]

  project-management-experiment-tracker:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Owns A/B experiment log, variants, success metrics, and rollback decisions"
    tools: [builtin]

  # Publishing — ship gate for QA'd builds (added 2026-04-18)
  # Twisted title generation + itch.io + GH Pages + Roblox Open Cloud (v2).
  # Every external publish tool below is RESTRICTED and routed through the
  # approval queue, same pattern as git_push.
  publisher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Packages approved builds, generates twisted title candidates, publishes to itch.io + GH Pages + Roblox, verifies live URLs, records manifest"
    tools: [builtin, package_html, itchio_publish, gh_pages_publish, roblox_publish, playwright_browser, git_push]

  # Engineering — rapid prototyping (imported from agency-agents — P0 batch)
  rapid-prototyper:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "One-session playable spikes — playcentric iteration, throwaway-ok code"
    tools: [builtin]

  # Compliance & cultural safety (imported from agency-agents — P0 batch, kids audience)
  compliance-auditor:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "COPPA / PEGI / ESRB / loot-box regulatory review for kids-audience titles"
    tools: [builtin]

  specialized-cultural-intelligence-strategist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Cultural appropriateness review for global kids-brand launches"
    tools: [builtin]

  # Analytics competency (imported from agency-agents — 2026-04-18)
  # Purpose: close the NPS loop — ingest events, surface insight, feed product.
  data-engineer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Event pipelines, warehouse schemas, ETL/ELT — raw play-events to analytics-ready tables"
    tools: [builtin]

  database-optimizer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Schema design, indexing, query plans — leaderboards and telemetry stores that scale"
    tools: [builtin]

  support-analytics-reporter:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "KPI dashboards, NPS driver analysis, cohort/retention reports, weekly studio readouts"
    tools: [builtin]

  product-feedback-synthesizer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Synthesizes qualitative feedback (support tickets, reviews, playtests) into prioritized product insight"
    tools: [builtin]
