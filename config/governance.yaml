# Tool Governance Configuration
# Controls which tools agents can use and which need human approval.
#
# Tiers (enforced by src/runtime/tool_executor.py):
#   builtin       — always allowed for any agent that lists the tool (or uses `tools: [builtin]`)
#   pre_approved  — allowed without prompt; dashboard-installed plugins/skills
#   restricted    — blocks on the approval queue (human must approve via dashboard)
#   blocked       — always denied
#
# In config/agents.yaml, use `tools: [builtin]` to grant an agent every builtin+pre_approved tool,
# or `tools: [builtin, git_push]` to grant builtins plus a specific restricted extra.

builtin:
  # Every tool in `core` + the role-specific extras below.
  # `tools: [builtin]` in agents.yaml still expands to this full set for
  # backward compat; prefer `tools: [core, ...]` for scoped assignments.
  # File & shell
  - file_read
  - file_write
  - file_edit
  - bash_execute
  # Search
  - grep
  - glob
  # Git (read/stage/local-commit; push stays restricted)
  - git_status
  - git_add
  - git_commit
  - git_diff
  # Web
  - web_search          # DuckDuckGo HTML (no key)
  - perplexity_research # Perplexity Sonar (needs PERPLEXITY_API_KEY)
  - web_fetch
  # Collaboration
  - channel_post
  - channel_read
  - escalate
  # Memory
  - memory_read
  - memory_write
  - memory_search
  # Orchestration
  - task_create
  # Claude Code skills
  - skill_invoke
  # Shared asset pools
  - asset_search
  - asset_fetch
  # itch.io player feedback scraper (stdlib-only, public pages)
  - fetch_itch_feedback
  # Headless browser for QA playtests
  - playwright_browser
  # Success criteria + revisioned docs + roster proposals
  - update_criterion_status
  - document_write
  - document_read
  - propose_agent

# Lean tier — file, search, git, collab, memory, docs. No web, no assets,
# no browser, no criterion status, no agent proposals. Use `tools: [core]`
# in agents.yaml for agents that only read/write code + memory.
core:
  - file_read
  - file_write
  - file_edit
  - bash_execute
  - grep
  - glob
  - git_status
  - git_add
  - git_commit
  - git_diff
  - channel_post
  - channel_read
  - escalate
  - memory_read
  - memory_write
  - memory_search
  - task_create
  - document_write
  - document_read

pre_approved:
  # User's existing Claude Code skills/plugins — allowed without prompt.
  - deploy_preview
  - run_tests
  - project_memory_read
  - project_memory_write
  # Iteration + cross-repo writes — local, reversible, no external side effects.
  - iteration_runner       # run playtest_bot.mjs batch + rollup (wraps run_playtest_batch)
  - external_repo_commit   # write files + stage + local commit in an artifact repo outside the worktree
  - scaffold_iteration     # emit the 4-file iteration kit into an artifact repo (wraps scaffold_iteration_artifacts)
  - repo_file_read         # read files from artifact repo (outside sandbox)
  - repo_file_write        # write files to artifact repo (outside sandbox, no commit)
  - repo_file_list         # list files in artifact repo

# Claude Code plugin surface — auto-allowed by prefix.
# Tools with names matching these prefixes bypass the approval queue on the
# grounds that the user already enabled the host MCP server / skill inside
# Claude Code. See src/runtime/mcp_bridge.py and src/runtime/skill_registry.py.
claude_plugins_prefixes:
  - "mcp__"         # all MCP server tools
  - "skill_invoke"  # the single skill invoker (exact match)

restricted:
  # Needs human approval before execution.
  - npm_install        # installing new packages
  - pip_install        # installing python packages
  - git_push           # pushing to remote
  - git_branch_delete  # deleting branches
  - external_api_call  # calling unknown APIs
  - create_agent       # spawning new agent types
  # Publisher targets — external side effects (uploads to itch.io / Pages / Roblox).
  - itchio_publish     # butler push to itch.io
  - gh_pages_publish   # commit + push to gh-pages branch
  - roblox_publish     # Roblox Open Cloud place upload

builtin_skills:
  # Skills that are auto-approved for all agents.
  - coding-standards
  - git-workflow
  - testing-patterns
  - asset-sources   # 8-pool asset documentation (kenney, itch, polyhaven, ambientcg, quaternius, pixabay, freesound, oga)

blocked:
  # Always denied.
  - rm_rf_outside_project   # never delete outside project dir
  - git_force_push          # never force push
  - drop_database           # never drop databases
  - modify_system_files     # never touch system config
