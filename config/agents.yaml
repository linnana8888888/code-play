# Agent Roster Configuration
# Maps agent IDs to their model routing and tool access.
#
# Approved model set (LEGO proxy + local + OpenRouter stealth, as of 2026-04-17):
#   - omlx/Qwen3.5-9B-MLX-4bit                                  (local, free)
#   - anthropic/anthropic.claude-opus-4-7                       (reasoning, $$$)
#   - anthropic/anthropic.claude-sonnet-4-6                     (balanced)
#   - anthropic/anthropic.claude-haiku-4-5-20251001-v1:0        (cheap)
#   - openai/gpt-5-2025-08-07                                   (reasoning, via LEGO)
#   - openrouter/openrouter/elephant-alpha                      (stealth/cloaked, free tier)
#
# OpenRouter format: first `openrouter/` is our router prefix, second is OR's model namespace.
# Only use OpenRouter for stealth/experimental models not available via LEGO proxy.
#
# Tools:
#   `tools: [core]`                       → lean tier: file, git, search, collab, memory, docs (19 tools)
#   `tools: [builtin]`                    → full tier: core + web + assets + browser + criteria (28+7 tools)
#   `tools: [core, web_search, web_fetch]`→ core + explicit extras
#   `tools: [core, mcp:playwright]`       → core + only Playwright MCP tools
#   `tools: [core, mcp]`                  → core + ALL MCP tools (avoid — ~105KB of schemas)
#   `mcp:<server>` resolves at prompt-build time to tools matching `mcp__<server>__*`.
# Prefer `core` + explicit extras over `builtin` to keep context lean.

defaults:
  model: "omlx/Qwen3.5-9B-MLX-4bit"
  fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
  temperature: 0.7
  max_tokens: 4096
  budget_max_tokens: 2000000   # 2M tokens — system prompt + tools consume ~600k baseline
  budget_max_usd: 1.00         # $1 per agent run (relevant for paid models)
  skills: []                   # no plugin skills injected by default — saves ~2MB context per agent

agents:
  # Game Development Core (2026-04-19 audit):
  #   game-designer         → absorbs narrative + level — produces mechanics_v1 (loop, scenes, flavor)
  #   game-audio-engineer   → Web Audio API + Roblox SoundService — produces audio_plan_v1
  #   technical-artist      → palette + 8-pool asset audit + hero glyph — produces laf_brief_v1
  # Pruned: narrative-designer, level-designer (folded into game-designer). Middleware/AAA
  # scope (FMOD/Wwise/LOD/BC7) removed from audio + tech-artist — kid web + Roblox only.
  game-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6" # creative decisions, keep Sonnet
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Mechanics + levels + flavor owner — produces mechanics_v1 for web + Roblox kid games"
    tools: [builtin, core, web_search, web_fetch, asset_search, asset_fetch, mcp]
    skills: [superpowers:brainstorming, superpowers:writing-plans, design-consultation, product-management:feature-spec]

  game-audio-engineer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Picks 5-7 SFX from approved free pools + wires Web Audio API / Roblox SoundService"
    tools: [builtin, core, asset_search, asset_fetch, mcp]
    skills: [superpowers:verification-before-completion]

  technical-artist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Palette + sprite atlas + hero glyph + 8-pool asset license audit for web/Roblox"
    tools: [builtin, core, web_search, web_fetch, asset_search, asset_fetch, mcp]
    skills: [document-skills:canvas-design, superpowers:verification-before-completion]

  # Engineering (2026-04-19 audit):
  #   frontend-developer  → web game implementation per tech_plan_v1
  #   code-reviewer       → shippability + kid-safety review (absorbed security checklist)
  #   tech-lead           → engineering plan before build (see below)
  # Pruned: backend-architect, security-engineer, devops-automator (enterprise personas, not
  # useful for a web+Roblox kid-game studio). Analytics tier (telemetry-engineer + metrics-
  # dashboard-builder) owns the data backend; publisher covers deploy to itch/GH/Roblox
  # (platforms run their own compliance review).
  frontend-developer:
    # 2026-04-19: GPT-5 route on LEGO proxy was 503'ing; Sonnet 4.6 route on the
    # same proxy is healthy. Switched primary to Sonnet and kept GPT-5 as fallback
    # for when the openai/ route recovers. Tried openrouter/elephant-alpha earlier
    # but the stealth model thrashed on filesystem discovery and hit budget cap
    # without producing game_html_v1 — not tool-use compliant.
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "openai/gpt-5-2025-08-07"
    description: "Web game implementer — builds game_html_v1 per tech_plan_v1 (Three.js/canvas + DOM UI)"
    tools: [builtin, core, web_search, web_fetch, asset_search, asset_fetch, external_repo_commit, repo_file_read, repo_file_write, repo_file_list, mcp]
    skills: [superpowers:test-driven-development, superpowers:systematic-debugging, document-skills:frontend-design]

  code-reviewer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Shippability + kid-safety review of web/Roblox game code against tech_plan_v1; absorbed lightweight security checklist"
    tools: [builtin, core, repo_file_read, repo_file_list, mcp]
    skills: [superpowers:receiving-code-review, superpowers:requesting-code-review, superpowers:verification-before-completion]

  # Unity (2026-04-20 — new engine tier for Unity game production)
  #   unity-specialist          → MonoBehaviour/DOTS, subsystems, best practices
  #   unity-shader-specialist   → Shader Graph, HLSL, VFX Graph, URP/HDRP
  #   unity-ui-specialist       → UI Toolkit, UGUI, data binding, accessibility
  #   gameplay-programmer       → Unity C# gameplay logic, state machines, data-driven design
  unity-specialist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Unity engine expert — MonoBehaviour/DOTS, Addressables, Input System, URP/HDRP, GC management, platform builds"
    tools: [builtin, core, mcp]

  unity-shader-specialist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Shader Graph, custom HLSL, VFX Graph, URP/HDRP customization, mobile/WebGL shader performance"
    tools: [builtin, core, mcp]

  unity-ui-specialist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "UI Toolkit (USS/UXML), UGUI, data binding/MVVM, responsive layout, accessibility (WCAG AA), localization"
    tools: [builtin, core, mcp]

  gameplay-programmer:
    model: "anthropic/anthropic.claude-sonnet-4-6" # writes code, keep Sonnet
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Unity C# gameplay implementation — mechanics, state machines, data-driven design (ScriptableObjects), frame-rate independent logic"
    tools: [builtin, core, external_repo_commit, repo_file_read, repo_file_write, repo_file_list, mcp]
    skills: [superpowers:test-driven-development, superpowers:systematic-debugging]

  # Roblox
  roblox-systems-scripter:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox Luau scripting specialist"
    tools: [builtin, core, mcp:Roblox-Studio, mcp]

  roblox-experience-designer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox engagement and monetization specialist"
    tools: [builtin, core, web_search, web_fetch, mcp:Roblox-Studio, mcp]

  roblox-avatar-creator:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Roblox UGC / avatar pipeline specialist — rigging, Classic + Layered Clothing, Creator Marketplace submission"
    tools: [builtin, core, asset_search, asset_fetch, mcp:Roblox-Studio, mcp]

  # Testing — 3-role game-focused taxonomy (2026-04-18):
  #   qa-engineer              → functional playtest (does it work?)
  #   game-performance-tester  → runtime cost (is it smooth + fast to load?)
  #   game-release-gate        → ship decision (QA + perf + a11y → go/no-go)
  qa-engineer:
    model: "anthropic/anthropic.claude-sonnet-4-6" # nuanced test decisions
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Playtest web games against the mechanics spec using a headless browser"
    tools: [builtin, core, playwright_browser, mcp:playwright, iteration_runner, generate_bot, update_criterion_status, mcp]
    skills: [superpowers:systematic-debugging, superpowers:test-driven-development, document-skills:webapp-testing, superpowers:verification-before-completion]

  game-performance-tester:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Runtime performance QA — frame rate, load time, heap on web (playwright) + static/microprofiler reasoning on Roblox"
    tools: [builtin, core, playwright_browser, mcp:playwright, mcp]

  game-release-gate:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Final ship/no-ship gate — cross-checks QA + perf evidence, owns web a11y + Roblox accessibility guide checks, defaults to HOLD"
    tools: [builtin, core, playwright_browser, mcp:playwright, update_criterion_status, mcp]
    skills: [superpowers:verification-before-completion]

  kid-safety-reviewer:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Checks game artifacts against kid-safety checklist (ages 9-12) before human gates"
    tools: [builtin, core, mcp]
    skills: []

  # Research
  style-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Research visual style references from live Roblox/web games"
    tools: [builtin, core, web_search, web_fetch, mcp]

  mechanic-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Teardown popular games → actionable mechanic steal-list for ideation before concept lock"
    tools: [builtin, core, web_search, web_fetch, mcp]
    skills: [product-management:competitive-analysis, superpowers:brainstorming]

  # Leadership (2026-04-20 — new tier: vision + architecture ownership)
  #   creative-director    → vision guardian, pillar arbiter, scope cut, conflict resolution
  #   technical-director   → architecture owner, tech evaluation, performance budgets, risk register
  creative-director:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Vision guardian — pillar methodology, MDA framework, player psychology, scope arbitration, cross-discipline conflict resolution"
    tools: [builtin, core, propose_agent, mcp]
    skills: [superpowers:brainstorming, design-consultation, product-management:competitive-analysis]

  technical-director:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Architecture owner — technology evaluation, performance budgets, risk register, ADR format, cross-system integration"
    tools: [builtin, core, web_search, web_fetch, propose_agent, mcp]
    skills: [superpowers:writing-plans, superpowers:brainstorming]

  # Engineering leadership
  tech-lead:
    model: "anthropic/anthropic.claude-sonnet-4-6" # engineering plan, nuanced
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Per-project engineering plan — picks engine, stack, module layout, coding standards; produces tech_plan_v1"
    tools: [builtin, core, web_search, web_fetch, mcp]
    skills: [superpowers:writing-plans, superpowers:brainstorming, product-management:feature-spec]

  # Stealth/experimental tier removed 2026-04-19 — OpenRouter was retired from the
  # router on 2026-04-17 so stealth-experiment had no working backend. The
  # `local-assistant` stanza that used to live here was removed 2026-04-20
  # because no `agents/**/local-assistant.md` existed — `registry.spawn` would
  # have raised on any attempt to run it.

  # Design (2026-04-19 audit — narrowed to kid web/Roblox game scope):
  #   hud-designer          → HUD + menu layout (6 screens) — produces hud_spec_v1
  #   screen-flow-designer  → state machine + transitions (5 states) — produces screen_flow_v1
  #   player-researcher     → market + behavior research for 6-12 kid games — produces trend_report_v1
  #   juice-polisher        → post-QA polish pass (shake/particles/hit-stop) — produces juice_pass_v1
  # Renamed from design-{ui,ux-architect,ux-researcher,whimsy-injector}. Brand/enterprise scope
  # stripped — these are kid-game roles, not microsite/IA/design-system roles.
  hud-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Lays out title + HUD + pause + win/lose screens for kid web/Roblox games; produces hud_spec_v1"
    tools: [builtin, core, web_search, web_fetch, mcp]
    skills: [document-skills:frontend-design, design-consultation]

  screen-flow-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Owns the 5-state machine + transition table + input bindings; produces screen_flow_v1"
    tools: [builtin, core, mcp]

  player-researcher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-opus-4-7"
    description: "Trend + behavior research for kid (6-12) web/Roblox game landscape; produces trend_report_v1"
    tools: [builtin, core, web_search, web_fetch, mcp]
    skills: [product-management:competitive-analysis, superpowers:brainstorming]

  juice-polisher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Post-QA game-juice pass (shake/particles/hit-stop/AV sync); 5-10 file:line deltas; produces juice_pass_v1"
    tools: [builtin, core, mcp]

  # Production (2026-04-19 audit — collapsed 3 orphan personas into 1 process owner):
  #   producer → drives phased-producer or iterate_artifact end-to-end; tracks
  #              artifacts + gates + blockers; owns production_status_v1 +
  #              human-gate packets. One instance per project.
  # Pruned: studio-producer (enterprise ROI/M&A — no game fit), project-shepherd
  # (generic cross-functional PM — zero callers), experiment-tracker (enterprise
  # A/B testing — zero callers; iterate_artifact pipeline already tracks variants).
  producer:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # process tracking, no reasoning
    description: "End-to-end process owner — drives phased-producer/iterate_artifact, verifies artifacts, prepares human-gate packets, reports status"
    tools: [builtin, core, update_criterion_status, propose_agent, mcp]
    skills: [product-management:roadmap-management, product-management:feature-spec, superpowers:verification-before-completion]

  handoff-summarizer:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # fast summarization, no reasoning needed
    description: "Writes concise handoff briefs before each human gate — decisions made, artifacts ready, what's next, watch-fors"
    tools: [builtin, core, mcp]
    skills: []

  # Publishing — ship gate for QA'd builds (added 2026-04-18)
  # Twisted title generation + itch.io + GH Pages + Roblox Open Cloud (v2).
  # Every external publish tool below is RESTRICTED and routed through the
  # approval queue, same pattern as git_push.
  publisher:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # packaging + deploy, no creativity
    description: "Packages approved builds, generates twisted title candidates, publishes to itch.io + GH Pages + Roblox, verifies live URLs, records manifest"
    tools: [builtin, core, web_fetch, playwright_browser, mcp:playwright, itchio_publish, gh_pages_publish, roblox_publish, git_push, mcp]

  # Engineering — rapid prototyping (imported from agency-agents — P0 batch)
  rapid-prototyper:
    model: "anthropic/anthropic.claude-sonnet-4-6" # writes code, keep Sonnet
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "One-session playable spikes — playcentric iteration, throwaway-ok code"
    tools: [builtin, core, web_search, web_fetch, asset_search, asset_fetch, external_repo_commit, scaffold_iteration, repo_file_read, repo_file_write, repo_file_list, mcp]
    skills: [superpowers:brainstorming, playground:playground, superpowers:systematic-debugging]

  # Compliance tier removed 2026-04-19 — target platforms (itch.io, GH Pages,
  # Roblox Creator Platform) run their own kids/content compliance review, so
  # compliance-auditor + specialized-cultural-intelligence-strategist were
  # pruned rather than rewritten. License audit still lives in publisher's
  # pre-flight via skills/asset-sources.md.

  # Analytics (2026-04-19 audit — rewritten as a cohesive game-analytics team):
  #   telemetry-engineer           → instruments the build, fewest-events-that-explain-a-quit; produces telemetry_spec_v1/_diff_v1
  #   metrics-dashboard-builder    → sqlite store + 4-chart single-HTML dashboard; produces metrics_store_spec_v1 + dashboard_html_v1
  #   analytics-reporter           → 4-section postmortem, goal hit/miss table, trend_v1, publish_blurb_v{N}
  #   player-feedback-synthesizer  → scrapes itch/GH/Roblox comments + studio DMs; produces player_feedback_v{N} with 3-5 quoted themes
  # Renamed from data-engineer, database-optimizer, support-analytics-reporter,
  # product-feedback-synthesizer. Enterprise scope (Snowflake, Spark, dbt, Redshift,
  # Tableau, PostgreSQL tuning) stripped — kid-game studio scale is sqlite + fetch().
  telemetry-engineer:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # boilerplate instrumentation
    description: "Instruments game_html + Roblox ServerScripts with the 8-event default catalogue; produces telemetry_spec_v1/_diff_v1; kid-safe, no PII, ≤2 events/sec"
    tools: [builtin, core, repo_file_read, repo_file_write, repo_file_list, external_repo_commit, mcp]

  metrics-dashboard-builder:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # config + schema generation
    description: "Owns metrics.sqlite (events + sessions rollup) and dashboard.html (4 charts, ≤1s cold load); produces metrics_store_spec_v1 + dashboard_html_v1"
    tools: [builtin, core, mcp]
    skills: [data:data-visualization, data:interactive-dashboard-builder]

  analytics-reporter:
    model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0" # summarizing, no reasoning needed
    description: "Writes the 4-section iteration postmortem + goal hit/miss table + trend_v1 + publish_blurb_v{N}; numbers-driven, ≤600 words"
    tools: [builtin, core, mcp]
    skills: [data:data-visualization]

  player-feedback-synthesizer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Digests itch.io/GH Pages/Roblox comments + studio DMs into 3-5 themes with ≥3 backing quotes each; produces player_feedback_v{N}"
    tools: [builtin, core, web_fetch, playwright_browser, mcp:playwright, mcp]
