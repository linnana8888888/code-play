# Agent Roster Configuration
# Maps agent IDs to their model routing and tool access.
#
# Approved model set (LEGO proxy + local + OpenRouter stealth, as of 2026-04-17):
#   - omlx/Qwen3.5-9B-MLX-4bit                                  (local, free)
#   - anthropic/anthropic.claude-opus-4-7                       (reasoning, $$$)
#   - anthropic/anthropic.claude-sonnet-4-6                     (balanced)
#   - anthropic/anthropic.claude-haiku-4-5-20251001-v1:0        (cheap)
#   - openai/gpt-5-2025-08-07                                   (reasoning, via LEGO)
#   - openrouter/openrouter/elephant-alpha                      (stealth/cloaked, free tier)
#
# OpenRouter format: first `openrouter/` is our router prefix, second is OR's model namespace.
# Only use OpenRouter for stealth/experimental models not available via LEGO proxy.
#
# Tools:
#   `tools: [builtin]`               → every builtin + pre_approved tool (parity with Claude Code).
#   `tools: [builtin, git_push, ..]` → builtins plus one or more restricted extras (still gated).
#   `tools: [file_read, channel_post, ...]` → explicit subset (no builtin expansion).

defaults:
  model: "omlx/Qwen3.5-9B-MLX-4bit"
  fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
  temperature: 0.7
  max_tokens: 4096
  budget_max_tokens: 200000    # 200k tokens per agent run
  budget_max_usd: 1.00         # $1 per agent run (relevant for paid models)

agents:
  # Game Development Core (2026-04-19 audit):
  #   game-designer         → absorbs narrative + level — produces mechanics_v1 (loop, scenes, flavor)
  #   game-audio-engineer   → Web Audio API + Roblox SoundService — produces audio_plan_v1
  #   technical-artist      → palette + 8-pool asset audit + hero glyph — produces laf_brief_v1
  # Pruned: narrative-designer, level-designer (folded into game-designer). Middleware/AAA
  # scope (FMOD/Wwise/LOD/BC7) removed from audio + tech-artist — kid web + Roblox only.
  game-designer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Mechanics + levels + flavor owner — produces mechanics_v1 for web + Roblox kid games"
    tools: [builtin]

  game-audio-engineer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Picks 5-7 SFX from approved free pools + wires Web Audio API / Roblox SoundService"
    tools: [builtin]

  technical-artist:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Palette + sprite atlas + hero glyph + 8-pool asset license audit for web/Roblox"
    tools: [builtin]

  # Engineering (2026-04-19 audit):
  #   frontend-developer  → web game implementation per tech_plan_v1
  #   code-reviewer       → shippability + kid-safety review (absorbed security checklist)
  #   tech-lead           → engineering plan before build (see below)
  # Pruned: backend-architect, security-engineer, devops-automator (enterprise personas, not
  # useful for a web+Roblox kid-game studio). data-engineer covers analytics backend;
  # publisher covers deploy to itch/GH/Roblox (platforms run their own compliance review).
  frontend-developer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Web game implementer — builds game_html_v1 per tech_plan_v1 (Three.js/canvas + DOM UI)"
    tools: [builtin]

  code-reviewer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-haiku-4-5-20251001-v1:0"
    description: "Shippability + kid-safety review of web/Roblox game code against tech_plan_v1; absorbed lightweight security checklist"
    tools: [builtin]

  # Roblox
  roblox-systems-scripter:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox Luau scripting specialist"
    tools: [builtin]

  roblox-experience-designer:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox engagement and monetization specialist"
    tools: [builtin]

  roblox-avatar-creator:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Roblox UGC / avatar pipeline specialist — rigging, Classic + Layered Clothing, Creator Marketplace submission"
    tools: [builtin]

  # Testing — 3-role game-focused taxonomy (2026-04-18):
  #   qa-engineer              → functional playtest (does it work?)
  #   game-performance-tester  → runtime cost (is it smooth + fast to load?)
  #   game-release-gate        → ship decision (QA + perf + a11y → go/no-go)
  qa-engineer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Playtest web games against the mechanics spec using a headless browser"
    tools: [builtin, playwright_browser]

  game-performance-tester:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Runtime performance QA — frame rate, load time, heap on web (playwright) + static/microprofiler reasoning on Roblox"
    tools: [builtin, playwright_browser]

  game-release-gate:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Final ship/no-ship gate — cross-checks QA + perf evidence, owns web a11y + Roblox accessibility guide checks, defaults to HOLD"
    tools: [builtin, playwright_browser]

  # Research
  style-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Research visual style references from live Roblox/web games"
    tools: [builtin]

  mechanic-researcher:
    model: "anthropic/anthropic.claude-opus-4-7"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Teardown popular games → actionable mechanic steal-list for ideation before concept lock"
    tools: [builtin]

  # Engineering leadership
  tech-lead:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "Picks engine/stack/module layout for the build step before implementation"
    tools: [builtin]

  # Local model agents (when you want to save costs)
  local-assistant:
    model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "General assistant running on local oMLX"
    tools: [builtin]

  # Stealth/experimental — OpenRouter cloaked models for benchmarking
  stealth-experiment:
    model: "openrouter/openrouter/elephant-alpha"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Stealth model (elephant-alpha) for experiments and benchmarking"
    tools: [builtin]

  # Design (2026-04-19 audit — narrowed to kid web/Roblox game scope):
  #   hud-designer          → HUD + menu layout (6 screens) — produces hud_spec_v1
  #   screen-flow-designer  → state machine + transitions (5 states) — produces screen_flow_v1
  #   player-researcher     → market + behavior research for 6-12 kid games — produces trend_report_v1
  #   juice-polisher        → post-QA polish pass (shake/particles/hit-stop) — produces juice_pass_v1
  # Renamed from design-{ui,ux-architect,ux-researcher,whimsy-injector}. Brand/enterprise scope
  # stripped — these are kid-game roles, not microsite/IA/design-system roles.
  hud-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Lays out title + HUD + pause + win/lose screens for kid web/Roblox games; produces hud_spec_v1"
    tools: [builtin]

  screen-flow-designer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Owns the 5-state machine + transition table + input bindings; produces screen_flow_v1"
    tools: [builtin]

  player-researcher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "anthropic/anthropic.claude-opus-4-7"
    description: "Trend + behavior research for kid (6-12) web/Roblox game landscape; produces trend_report_v1"
    tools: [builtin]

  juice-polisher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Post-QA game-juice pass (shake/particles/hit-stop/AV sync); 5-10 file:line deltas; produces juice_pass_v1"
    tools: [builtin]

  # Production (2026-04-19 audit — collapsed 3 orphan personas into 1 process owner):
  #   producer → drives phased-producer or iterate_artifact end-to-end; tracks
  #              artifacts + gates + blockers; owns production_status_v1 +
  #              human-gate packets. One instance per project.
  # Pruned: studio-producer (enterprise ROI/M&A — no game fit), project-shepherd
  # (generic cross-functional PM — zero callers), experiment-tracker (enterprise
  # A/B testing — zero callers; iterate_artifact pipeline already tracks variants).
  producer:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "End-to-end process owner — drives phased-producer/iterate_artifact, verifies artifacts, prepares human-gate packets, reports status"
    tools: [builtin]

  # Publishing — ship gate for QA'd builds (added 2026-04-18)
  # Twisted title generation + itch.io + GH Pages + Roblox Open Cloud (v2).
  # Every external publish tool below is RESTRICTED and routed through the
  # approval queue, same pattern as git_push.
  publisher:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Packages approved builds, generates twisted title candidates, publishes to itch.io + GH Pages + Roblox, verifies live URLs, records manifest"
    tools: [builtin, package_html, itchio_publish, gh_pages_publish, roblox_publish, playwright_browser, git_push]

  # Engineering — rapid prototyping (imported from agency-agents — P0 batch)
  rapid-prototyper:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "One-session playable spikes — playcentric iteration, throwaway-ok code"
    tools: [builtin]

  # Compliance tier removed 2026-04-19 — target platforms (itch.io, GH Pages,
  # Roblox Creator Platform) run their own kids/content compliance review, so
  # compliance-auditor + specialized-cultural-intelligence-strategist were
  # pruned rather than rewritten. License audit still lives in publisher's
  # pre-flight via skills/asset-sources.md.

  # Analytics competency (imported from agency-agents — 2026-04-18)
  # Purpose: close the NPS loop — ingest events, surface insight, feed product.
  data-engineer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Event pipelines, warehouse schemas, ETL/ELT — raw play-events to analytics-ready tables"
    tools: [builtin]

  database-optimizer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Schema design, indexing, query plans — leaderboards and telemetry stores that scale"
    tools: [builtin]

  support-analytics-reporter:
    model: "openai/gpt-5-2025-08-07"
    fallback_model: "anthropic/anthropic.claude-sonnet-4-6"
    description: "KPI dashboards, NPS driver analysis, cohort/retention reports, weekly studio readouts"
    tools: [builtin]

  product-feedback-synthesizer:
    model: "anthropic/anthropic.claude-sonnet-4-6"
    fallback_model: "omlx/Qwen3.5-9B-MLX-4bit"
    description: "Synthesizes qualitative feedback (support tickets, reviews, playtests) into prioritized product insight"
    tools: [builtin]
