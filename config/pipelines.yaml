# Pipeline Definitions
# Declarative agent chains for game production workflows

pipelines:
  phased-producer:
    name: "Phased Producer (human-gated)"
    description: "Concept → mechanics → style-research → look-and-feel → tech-plan → build → QA, with a human gate at every major phase"
    steps:
      - id: concept
        agent: game-designer
        task: "Draft 3 distinct concept directions for: {input}. For each: one-line pitch, core loop (2-3 sentences), target feel. Save to memory as artifact key 'concept_options_v1'."
        output: concepts

      - id: gate-concept
        type: human-gate
        depends_on: [concept]
        review_of: concept
        task: "Review the 3 concept directions. Pick one, request changes, or regenerate."

      - id: mechanics
        agent: game-designer
        depends_on: [gate-concept]
        task: "Expand the approved concept (memory key: concept_options_v1, see review notes for chosen direction) into a mechanics doc: player verbs, progression, win/lose conditions, 2-3 signature systems. Save to memory as artifact key 'mechanics_v1'."
        output: mechanics

      - id: gate-mechanics
        type: human-gate
        depends_on: [mechanics]
        review_of: mechanics
        task: "Review the mechanics doc. Approve, or request changes with specific feedback."

      - id: style-research
        agent: style-researcher
        depends_on: [gate-mechanics]
        task: |
          Read concept_options_v1 + mechanics_v1 from memory. The target platform style
          reference is Roblox (kids audience, low-poly stylized 3D). Find 6-10 live Roblox
          games that match this project's genre AND its comedic/narrative subject. For
          each reference save: game name, cover_url, 2-3 screenshot_urls, a one-line note
          on "why this reads" (silhouette / palette / camera / material vibe).
          Close with:
            - Synthesis paragraph: the concrete style to target (engine class, camera,
              palette feel, material treatment, character proportions, UI chrome).
            - Character design section: describe the player AND each enemy literally —
              silhouette, proportions, colors. Do not sanitize the subject of the brief.
            - Palette block: 5-9 hex codes organised as primary / accent / enemy / fx / bg.
            - "Don't do this" list: 3-5 anti-patterns to avoid.
          Save to memory as artifact key 'style_research_v1'.
        output: style_research

      - id: look-and-feel
        agent: technical-artist
        depends_on: [style-research]
        task: |
          Read style_research_v1 from memory FIRST — the brief must match it. Then read
          concept_options_v1 + mechanics_v1. Now ground the look-and-feel:
            1. Call asset_search (pool='both') with 2-3 queries derived from the style
               research synthesis (not generic genre terms). Include at least one query
               per pool so BOTH kenney and itch are represented.
            2. Pick 3-5 concrete hits across the two pools that share the aesthetic the
               research specified. If nothing fits the research, say so explicitly — do
               not silently sanitize to match generic assets.
            3. Call asset_fetch(kind='preview') on each pick to pull thumbnails into
               assets/. If a fetch fails, note it in the brief (don't silently skip).
            4. Draft the brief with these sections:
                 - Palette (3-7 hex codes, derive from the style_research palette block).
                 - Art style (reference chosen asset_ids AND the research synthesis
                   paragraph verbatim).
                 - Character design (player + enemies — literal, per the research).
                 - UI / typography direction.
                 - Audio tone.
                 - References (list the asset_ids).
          Save the final brief to memory as artifact key 'laf_brief_v1'.
        output: look_and_feel

      - id: gate-laf
        type: human-gate
        depends_on: [look-and-feel]
        review_of: look-and-feel
        task: "Review the look-and-feel brief against the style research. Approve, or request changes."

      - id: tech-plan
        agent: tech-lead
        depends_on: [gate-laf]
        task: |
          Read concept_options_v1 + mechanics_v1 + style_research_v1 + laf_brief_v1 from memory.
          Pick ONE engine from the project's tech_stack list (or infer from research if 3D is
          targeted: three.js or babylon.js). Justify in 1-2 sentences. Define:
            - File layout (single HTML vs modules).
            - Scene / screen list.
            - Asset loader strategy: map each referenced asset_id to a concrete load call.
            - Input model (keyboard, mouse, gamepad).
            - Game loop shape (fixed timestep? rAF? how pause/resume works).
            - Test hook convention: expose `window.__game` with { player, enemies, projectiles,
              state } so the QA step can assert state.
          Keep it to ≤ 1 page. Save to memory as artifact key 'tech_plan_v1'.
        output: tech_plan

      - id: gate-tech
        type: human-gate
        depends_on: [tech-plan]
        review_of: tech-plan
        task: "Review the tech plan. Approve the stack + structure, or request changes."

      - id: build
        agent: frontend-developer
        depends_on: [gate-tech]
        task: |
          Build a playable web prototype from the approved plan. Read these memory keys verbatim
          BEFORE writing any code: concept_options_v1, mechanics_v1, style_research_v1,
          laf_brief_v1, tech_plan_v1.

          Engine choice: follow tech_plan_v1 exactly. If the plan picked three.js / babylon.js,
          deliver a 3D scene — a 2D canvas on a 3D brief is a build failure.
          File layout: follow tech_plan_v1 exactly (usually a single self-contained HTML file
          with an importmap for three.js).
          Test hook: expose window.__game = { player, enemies, projectiles, state } — the QA
          step depends on this.
          Do not sanitize the brief's character design. The joke / subject matter IS the
          look-and-feel.

          Save the final HTML to memory as artifact key 'game_html_v1'.
        output: code

      - id: instrument
        agent: telemetry-engineer
        depends_on: [build]
        task: |
          Read 'game_html_v1' + 'mechanics_v1' + 'tech_plan_v1' from memory. Patch
          the HTML in-place to emit the 8-event default catalogue (session_start,
          first_playable, tutorial_step_completed, death, retry, win, quit,
          session_end) via `fetch('/telemetry', {method:'POST', keepalive:true})`.

          Rules:
            - Expose a TRACK(name, payload) helper on window.__game.
            - session_start fires AFTER the first player input, not on load
              (title-screen opt-out).
            - No PII: never send names, emails, IPs, screen text.
              ua_hash = sha256(navigator.userAgent).slice(0,8).
            - Rate-limit: ≤ 2 events/sec per session (drop the rest, don't queue).
            - keepalive:true on every fetch so session_end survives page close.

          Overwrite 'game_html_v1' in memory with the patched HTML and write the
          event schema to 'telemetry_spec_v1':
            { events: [{name, fires_when, payload_keys, sample_rate}],
              endpoint, session_id_strategy, kid_safety_notes }.
        output: telemetry_spec

      - id: qa-playtest
        agent: qa-engineer
        depends_on: [instrument]
        task: |
          Read game_html_v1 + mechanics_v1 from memory. Launch the HTML in a headless browser
          via the playwright_browser tool. Verify:
            1. Page loads with no console errors in the first 3 seconds.
            2. window.__game exists and exposes { player, enemies, projectiles, state }.
            3. For each player verb in mechanics_v1 (move, shoot, dash, …): drive the input
               and assert observable state change (e.g. player.x changed after WASD;
               projectiles.length > 0 after click). One check per verb.
            4. If style_research_v1 calls for 3D, assert the scene is WebGL-driven
               (getContext('webgl') must return non-null).
            5. Screenshot title, post-first-move, mid-combat — save paths under
               assets/qa/ and reference them in the report.
          Save a structured report to memory as 'qa_report_v1':
            { verdict: pass|fail, checks: [{name, pass, evidence_path, note}], console_errors: […] }.
        output: qa_report

      - id: gate-qa
        type: human-gate
        depends_on: [qa-playtest]
        review_of: qa-playtest
        task: |
          Review the QA report + screenshots and actually play the game (primary button on
          the gate). Approve to ship, or request changes to kick the build step back with
          your feedback.

      - id: review
        agent: code-reviewer
        depends_on: [gate-qa]
        task: "Lint report only — review the prototype (memory key: game_html_v1) for bugs, performance, security. QA already validated gameplay; this is for code-quality concerns only."
        output: review

      - id: scaffold-iteration
        agent: rapid-prototyper
        depends_on: [review]
        task: |
          The build has shipped and passed QA. Make this artifact iteration-ready
          so it can be improved via the `iterate_artifact` pipeline later.

          Step 1: Call the `scaffold_iteration` tool with
          {artifact_dir: memory[`artifact_repo_path`], project_title: <game title>}.
          The tool writes the 4-file kit (ITERATION_CONTRACT.md, GOALS.md,
          playtest_bot.mjs, telemetry/.gitkeep, .codeplay/config.yaml) and
          saves their paths to memory. Do NOT shell python/node or try to
          import src.iteration.scaffolder — your sandbox can't reach the
          code-play repo. This tool IS the binding.

          Step 2: Read the just-written GOALS.md via the path memory[`goals_path`]
          (use `file_read` on that absolute path). Adjust the 5 thresholds to
          plausible numbers for THIS game's loop (be conservative — pick a
          median you could hit on a decent run). Re-write via `file_write`.

          Step 3: Stage + commit all scaffold files with the `external_repo_commit`
          tool (repo_path=artifact_repo_path, files=[…the 5 paths], message="scaffold
          iteration kit v1"). Skip any per-file content re-read if possible —
          external_repo_commit writes the content you pass. For files you just
          modified (GOALS.md), pass the updated content; for the other four,
          pass the content returned by the scaffold tool.

          Save a one-line report as memory artifact key 'iteration_scaffold_v1'.
        output: iteration_scaffold

      - id: dashboard-init
        agent: metrics-dashboard-builder
        depends_on: [scaffold-iteration]
        task: |
          The artifact repo now has telemetry/ (from scaffold-iteration) and the
          instrumented game emits the 8-event catalogue. Stand up the analytics
          store + single-HTML dashboard.

          Write these files into memory[`artifact_repo_path`] via
          external_repo_commit (do NOT shell git/python):
            - tools/metrics_rollup.py — idempotent; walks telemetry/*.json,
              upserts rows into metrics.sqlite (events + sessions rollup tables).
              Dedup by (session_id, name, ts).
            - dashboard.html — single file, loads sql.js + uPlot from CDN,
              fetch()es metrics.sqlite next to itself, renders 4 charts:
                1) sessions/day (last 14d), 2) session-length histogram,
                3) tutorial → first_playable → win funnel,
                4) top-5 death causes (from `death.cause` payload).
              Cold load ≤ 1s, transfer ≤ 2MB, no React, no build step.
            - metrics.sqlite — empty schema (events, sessions), committed so
              the dashboard loads cleanly on an empty artifact repo.

          Save to memory: 'metrics_store_spec_v1' (DDL + rollup contract) and
          'dashboard_html_v1' (path to the committed file).
        output: dashboard

      - id: blurb
        agent: analytics-reporter
        depends_on: [dashboard-init]
        task: |
          Write 'publish_blurb_v1' for this ship. ≤ 80 words. Numbers-driven.

          Read from memory: mechanics_v1, laf_brief_v1, qa_report_v1,
          telemetry_spec_v1. Lead with the player-verb hook, one-sentence
          differentiation, one metric that signals "we actually playtested"
          (pull from qa_report_v1 evidence or reference the instrumented
          funnel). Kid-audience tone; itch.io listing voice; no enterprise speak.

          Save as 'publish_blurb_v1'. The publisher will paste this into the
          itch long-desc intro.
        output: blurb

      - id: publish-prep
        agent: publisher
        depends_on: [blurb]
        task: |
          Ship-gate preparation. Source of truth is games/<slug>.yaml — read it
          first to locate the repo and resolve the version the pipeline is
          shipping. For source.kind=external, shallow-clone the repo at the
          version's ref into a temp worktree; for kind=internal, read from the
          internal path. Freeze the resolved sha — never ship a moving branch tip.

          Also read from memory: concept_options_v1, mechanics_v1, laf_brief_v1,
          qa_report_v1, game_html_v1, publish_blurb_v1.

          Run the pre-flight checklist:
            1. games/<slug>.yaml exists and the target version has a resolvable ref
               (git rev-parse succeeds in the cloned source).
            2. HTML validates; no file:// or localhost references.
            3. Every asset_id referenced in laf_brief_v1 maps to an entry in
               skills/asset-sources.md with a compatible license (CC0 / CC-BY / Kenney).
            4. qa_report_v1 verdict is "pass".
            5. QA screenshots exist under the resolved source's qa/ dir.

          Then generate THREE twisted title candidates. The working slug from the
          index is the engineering codename, not the ship name — bend it into
          something memorable (pun, metaphor, cute noun pairing). ≤ 22 characters
          each. Respect kids-audience tone. Write a one-line rationale per
          candidate and mark your preferred pick.

          Synthesize listing metadata (tagline ≤ 60 chars, short desc ≤ 140,
          long desc ≤ 4000 markdown, 5-10 tags, cover image spec, screenshot
          references from qa/). Generate a flat itch-compatible package at
          artifacts/<slug>/dist/<label>/ and zip it to
          artifacts/<slug>/dist/<label>.zip.

          Targets for v1: ["itch.io", "gh-pages"]. Roblox target is accepted only
          if source produces a .rbxl.

          Save publish_plan_v1 to memory with:
            { slug, version_label, resolved_ref, source_repo, slug_options, chosen_slug,
              metadata, package_path, package_sha256, package_bytes, targets,
              preflight_results, estimated_urls }.

          DO NOT PUBLISH. Stop here and wait for gate-publish.
        output: publish_plan

      - id: gate-publish
        type: human-gate
        depends_on: [publish-prep]
        review_of: publish-prep
        task: |
          Ship gate. Review publish_plan_v1:
            - Confirm slug + version_label + resolved_ref match intent.
            - Pick one of the three twisted title candidates (or reject and ask for
              three new ones).
            - Review metadata, cover mock, screenshots.
            - Confirm target list (defaults: itch.io + gh-pages).
          Approve to publish, skip a specific target, or request changes. This is
          the moment when a public URL is created with your handle on it.

      - id: publish
        agent: publisher
        depends_on: [gate-publish]
        task: |
          Execute publish_plan_v1 with the approved title. Push to each approved
          target in parallel:
            - itch.io via itchio_publish (butler push + butler status).
            - gh-pages via gh_pages_publish (commit docs/<slug>/ on gh-pages branch).
            - roblox via roblox_publish (Open Cloud PATCH place — only if approved).
          For each target: HEAD the URL until 200, Playwright-load it headless,
          take a live screenshot under assets/publish/<slug>/, note any console
          errors.

          Write publish_manifest_v1 to memory with slug, version_label, resolved_ref,
          source_repo, chosen_title, published_at, targets (name/url/status/bytes/
          live_shot), compliance_rating, assets_licensed.

          Then patch games/<slug>.yaml IN PLACE: set the shipped version's
          published.<target> to the live URL and flip its status to "shipped".
          Append a row to docs/published-games.md.

          Post ONE message to the project channel: "🎪 Shipped: <title> — <primary_url>
          — <live_screenshot>". Nothing else.
        output: manifest

  phased-producer-race:
    name: "Phased Producer (A/B build race)"
    description: "Same as phased-producer but fans out the build step to two parallel agents on different models with a pick gate."
    steps:
      - id: concept
        agent: game-designer
        task: "Draft 3 distinct concept directions for: {input}. For each: one-line pitch, core loop (2-3 sentences), target feel. Save to memory as artifact key 'concept_options_v1'."
        output: concepts

      - id: gate-concept
        type: human-gate
        depends_on: [concept]
        review_of: concept
        task: "Review the 3 concept directions. Pick one, request changes, or regenerate."

      - id: mechanics
        agent: game-designer
        depends_on: [gate-concept]
        task: "Expand the approved concept into a mechanics doc. Save as 'mechanics_v1'."
        output: mechanics

      - id: gate-mechanics
        type: human-gate
        depends_on: [mechanics]
        review_of: mechanics
        task: "Review the mechanics doc."

      - id: style-research
        agent: style-researcher
        depends_on: [gate-mechanics]
        task: "Roblox-style research, save as 'style_research_v1'."
        output: style_research

      - id: look-and-feel
        agent: technical-artist
        depends_on: [style-research]
        task: "Read style_research_v1 first; produce 'laf_brief_v1' matching it."
        output: look_and_feel

      - id: gate-laf
        type: human-gate
        depends_on: [look-and-feel]
        review_of: look-and-feel
        task: "Review the look-and-feel brief."

      - id: tech-plan
        agent: tech-lead
        depends_on: [gate-laf]
        task: "Engine + layout + asset loader + input model + loop shape. Save as 'tech_plan_v1'."
        output: tech_plan

      - id: gate-tech
        type: human-gate
        depends_on: [tech-plan]
        review_of: tech-plan
        task: "Review the tech plan."

      # Two builders run in parallel on different models, each writing to a
      # namespaced artifact key so they don't clobber one another.
      - id: build-a
        agent: frontend-developer
        depends_on: [gate-tech]
        model_override: "openai/gpt-5-2025-08-07"
        task: |
          Build the game per tech_plan_v1. Save HTML to memory artifact 'game_html_v1@a'.
          Expose window.__game = { player, enemies, projectiles, state }.
        output: code_a

      - id: build-b
        agent: frontend-developer
        depends_on: [gate-tech]
        model_override: "anthropic/anthropic.claude-opus-4-7"
        task: |
          Build the game per tech_plan_v1. Save HTML to memory artifact 'game_html_v1@b'.
          Expose window.__game = { player, enemies, projectiles, state }.
        output: code_b

      - id: gate-build-pick
        type: human-gate
        depends_on: [build-a, build-b]
        review_of: build-a
        task: "Play both candidate builds side-by-side. Pick A or B — the winning artifact will be promoted to 'game_html_v1' for downstream QA."

      - id: instrument
        agent: telemetry-engineer
        depends_on: [gate-build-pick]
        task: |
          Patch the winning 'game_html_v1' with the 8-event telemetry catalogue
          (session_start, first_playable, tutorial_step_completed, death, retry,
          win, quit, session_end) via `fetch('/telemetry', {method:'POST',
          keepalive:true})`. Expose window.__game.TRACK. No PII, ≤2 events/sec,
          session_start on first input (not page load). Overwrite 'game_html_v1'
          and save 'telemetry_spec_v1'.
        output: telemetry_spec

      - id: qa-playtest
        agent: qa-engineer
        depends_on: [instrument]
        task: "Playtest game_html_v1 against mechanics_v1. Save 'qa_report_v1'."
        output: qa_report

      - id: gate-qa
        type: human-gate
        depends_on: [qa-playtest]
        review_of: qa-playtest
        task: "Review QA evidence + play the game. Approve or request changes."

      - id: review
        agent: code-reviewer
        depends_on: [gate-qa]
        task: "Lint report on game_html_v1 (code quality/security only)."
        output: review

      - id: scaffold-iteration
        agent: rapid-prototyper
        depends_on: [review]
        task: |
          Shipping done. Scaffold iteration kit so this artifact can be improved
          via iterate_artifact.

          1. Call the `scaffold_iteration` tool with
             {artifact_dir: memory[`artifact_repo_path`]}. It writes the 4-file
             kit and persists paths to memory. Do NOT import the scaffolder
             module directly — sandbox can't reach the code-play repo.
          2. Read GOALS.md (path: memory[`goals_path`]) via `file_read`, tune
             the 5 thresholds to plausible numbers for this game's loop, rewrite.
          3. Call `external_repo_commit` with repo_path + the list of scaffolded
             files + message "scaffold iteration kit v1" to stage and commit.

          Save one-line note as memory key 'iteration_scaffold_v1'.
        output: iteration_scaffold

      - id: dashboard-init
        agent: metrics-dashboard-builder
        depends_on: [scaffold-iteration]
        task: |
          Write tools/metrics_rollup.py + dashboard.html + empty metrics.sqlite
          into memory[`artifact_repo_path`] via external_repo_commit. sql.js +
          uPlot from CDN, 4 charts (sessions/day, session-length histogram,
          tutorial→win funnel, top-5 death causes). Cold load ≤ 1s. Save
          'metrics_store_spec_v1' + 'dashboard_html_v1' to memory.
        output: dashboard

      - id: blurb
        agent: analytics-reporter
        depends_on: [dashboard-init]
        task: |
          Write 'publish_blurb_v1' (≤80 words, itch.io tone). Read mechanics_v1,
          laf_brief_v1, qa_report_v1, telemetry_spec_v1. Hook → differentiation →
          one playtested metric.
        output: blurb

      - id: publish-prep
        agent: publisher
        depends_on: [blurb]
        task: |
          Ship-gate preparation. Source of truth is games/<slug>.yaml — read it
          first to locate the repo and resolve the version the pipeline is
          shipping. For source.kind=external, shallow-clone the repo at the
          version's ref into a temp worktree; for kind=internal, read from the
          internal path. Freeze the resolved sha — never ship a moving branch tip.

          Also read from memory: concept_options_v1, mechanics_v1, laf_brief_v1,
          qa_report_v1, game_html_v1, publish_blurb_v1.

          Run the pre-flight checklist:
            1. games/<slug>.yaml exists and the target version has a resolvable ref
               (git rev-parse succeeds in the cloned source).
            2. HTML validates; no file:// or localhost references.
            3. Every asset_id referenced in laf_brief_v1 maps to an entry in
               skills/asset-sources.md with a compatible license (CC0 / CC-BY / Kenney).
            4. qa_report_v1 verdict is "pass".
            5. QA screenshots exist under the resolved source's qa/ dir.

          Then generate THREE twisted title candidates. The working slug from the
          index is the engineering codename, not the ship name — bend it into
          something memorable (pun, metaphor, cute noun pairing). ≤ 22 characters
          each. Respect kids-audience tone. Write a one-line rationale per
          candidate and mark your preferred pick.

          Synthesize listing metadata (tagline ≤ 60 chars, short desc ≤ 140,
          long desc ≤ 4000 markdown, 5-10 tags, cover image spec, screenshot
          references from qa/). Generate a flat itch-compatible package at
          artifacts/<slug>/dist/<label>/ and zip it to
          artifacts/<slug>/dist/<label>.zip.

          Targets for v1: ["itch.io", "gh-pages"]. Roblox target is accepted only
          if source produces a .rbxl.

          Save publish_plan_v1 to memory with:
            { slug, version_label, resolved_ref, source_repo, slug_options, chosen_slug,
              metadata, package_path, package_sha256, package_bytes, targets,
              preflight_results, estimated_urls }.

          DO NOT PUBLISH. Stop here and wait for gate-publish.
        output: publish_plan

      - id: gate-publish
        type: human-gate
        depends_on: [publish-prep]
        review_of: publish-prep
        task: |
          Ship gate. Review publish_plan_v1:
            - Confirm slug + version_label + resolved_ref match intent.
            - Pick one of the three twisted title candidates (or reject and ask for
              three new ones).
            - Review metadata, cover mock, screenshots.
            - Confirm target list (defaults: itch.io + gh-pages).
          Approve to publish, skip a specific target, or request changes. This is
          the moment when a public URL is created with your handle on it.

      - id: publish
        agent: publisher
        depends_on: [gate-publish]
        task: |
          Execute publish_plan_v1 with the approved title. Push to each approved
          target in parallel:
            - itch.io via itchio_publish (butler push + butler status).
            - gh-pages via gh_pages_publish (commit docs/<slug>/ on gh-pages branch).
            - roblox via roblox_publish (Open Cloud PATCH place — only if approved).
          For each target: HEAD the URL until 200, Playwright-load it headless,
          take a live screenshot under assets/publish/<slug>/, note any console
          errors.

          Write publish_manifest_v1 to memory with slug, version_label, resolved_ref,
          source_repo, chosen_title, published_at, targets (name/url/status/bytes/
          live_shot), compliance_rating, assets_licensed.

          Then patch games/<slug>.yaml IN PLACE: set the shipped version's
          published.<target> to the live URL and flip its status to "shipped".
          Append a row to docs/published-games.md.

          Post ONE message to the project channel: "🎪 Shipped: <title> — <primary_url>
          — <live_screenshot>". Nothing else.
        output: manifest

  new-game:
    name: "New Game Production"
    description: "Full pipeline from concept to deployed prototype"
    steps:
      - id: concept
        agent: game-designer
        task: "Produce mechanics_v1 (pitch, core loop, scene list, flavor text, tuning table) from concept: {input}"
        output: mechanics_v1

      - id: prototype
        agent: frontend-developer
        depends_on: [concept]
        task: "Build a playable web prototype implementing mechanics_v1 core loop. Use the tech_stack specified in the project (Phaser, Three.js, Pixi.js, Babylon.js, or plain web). Keep it a single HTML file when possible."
        output: prototype_code

      - id: review
        agent: code-reviewer
        depends_on: [prototype]
        task: "Shippability + kid-safety review of prototype against mechanics_v1"
        output: review_feedback

      - id: human-review
        type: human-gate
        depends_on: [prototype, review]
        task: "Review prototype + review feedback. Approve to continue."

  quick-prototype:
    name: "Quick Prototype"
    description: "Fast prototype from a one-line idea — parallel art + build after design"
    steps:
      - id: design
        agent: game-designer
        task: "Create a minimal GDD for: {input}. Focus on core loop only. Save to memory as artifact key 'gdd_v1'."
        output: gdd

      - id: art-brief
        agent: technical-artist
        depends_on: [design]
        task: "Based on the GDD in memory (key: gdd_v1), draft a short art brief: color palette (3-5 hex codes), sprite style, UI font suggestion. Save to memory as artifact key 'art_brief_v1'."
        output: art_brief

      - id: build
        agent: frontend-developer
        depends_on: [design]
        task: "Build a playable web prototype from the GDD (memory key: gdd_v1). Use the project's tech_stack (Phaser, Three.js, Pixi.js, Babylon.js, or plain web). Prefer a single HTML file. Save the final HTML to memory as artifact key 'game_html_v1'."
        output: code

      - id: review
        agent: code-reviewer
        depends_on: [build]
        task: "Review the HTML prototype in memory (key: game_html_v1) for bugs, performance, and security. Short report only."
        output: review

  roblox-experience:
    name: "Roblox Experience"
    description: "Pipeline for Roblox game development"
    steps:
      - id: design
        agent: roblox-experience-designer
        task: "Design Roblox experience for: {input}"
        output: design_doc

      - id: script
        agent: roblox-systems-scripter
        depends_on: [design]
        task: "Implement the core systems in Luau"
        output: scripts

      - id: review
        agent: code-reviewer
        depends_on: [script]
        task: "Review Luau scripts for security and performance"
        output: review

  iterate_artifact:
    name: "Iterate on an existing game (playtest → postmortem → propose → implement, looped)"
    description: |
      Cyclic pipeline. Each cycle plays the current build headlessly 5×, writes
      a postmortem grounded in GOALS.md, fans out 4 parallel proposals, waits
      for one human pick, implements it, and relaunches — capped by the
      cycle_state budget (default 5) or a halt_reason flag.
    cyclic: true
    terminal_step: implement
    steps:
      - id: playtest
        agent: qa-engineer
        task: |
          Run the playtest batch for iteration {{iteration_tag}} (cycle {{cycle_n}}).

          Call the `iteration_runner` tool with {repo_path, cycle_n={{cycle_n}},
          runs=5, seconds_per_run=60}. Read `repo_path` from memory key
          `artifact_repo_path` (or the project's registered repo path).

          Do NOT shell python/node yourself. Do NOT try to read
          `src/iteration/iterate_runner.py` from the code-play repo — your sandbox
          is scoped to your own worktree. The `iteration_runner` tool IS the
          binding to that runner: it spawns `python3 -m http.server` on a free
          port, shells `node playtest_bot.mjs --runs 5 --seconds 60 --tag
          {{iteration_tag}}` against it, aggregates every `<repo>/telemetry/*.json`
          whose iteration_tag matches, writes the rollup to project memory as
          artifact `telemetry_{{iteration_tag}}`, and broadcasts
          `playtest_batch_complete`.

          If the tool returns `node_exit_code != 0`, surface its `stdout_tail`
          in the task result — do NOT write a rollup that's missing runs.

          Required memory output: artifact key `telemetry_{{iteration_tag}}`
          (written by the tool).
        output: telemetry

      - id: dashboard-refresh
        agent: metrics-dashboard-builder
        depends_on: [playtest]
        task: |
          The playtest just wrote new telemetry/*.json to the artifact repo.
          Re-run tools/metrics_rollup.py (via external_repo_commit with a
          run-script step, or inline the rollup and rewrite metrics.sqlite) so
          the new session rows land in the store. Commit metrics.sqlite back to
          the iteration branch. Dashboard.html does not change this cycle.

          Save 'metrics_store_refresh_v{{cycle_n}}' = { rows_added,
          sessions_added, generated_at }.

          If tools/metrics_rollup.py is missing (pre-analytics artifact), fail
          the task with a clear message — don't silently skip; the phased-
          producer pipeline should have set this up.
        output: dashboard_refresh

      - id: feedback-synthesis
        agent: player-feedback-synthesizer
        depends_on: [playtest]
        task: |
          Digest player comments for cycle {{cycle_n}}. Conditional: if the
          project has no publish_manifest_v1 in memory (not yet shipped), save
          'player_feedback_v{{cycle_n}}' = { skipped: true, reason:
          "not_published" } and return — do NOT fabricate comments.

          If published, scrape comments from the URLs in publish_manifest_v1
          (itch.io page, GH Pages issues, Roblox experience reviews). Include
          studio-DM snippets with player feedback since last cycle. Scrub PII:
          names → handles, emails → redacted.

          Produce 3-5 themes, each with ≥ 3 backing verbatim quotes. Tag each
          quote kid/parent/unknown. For each theme, add a
          'direction_to_proposal' hint (designer|ux|artist|proto) so the next
          proposal step can pick it up.

          Save as 'player_feedback_v{{cycle_n}}'.
        output: player_feedback

      - id: postmortem
        agent: analytics-reporter
        depends_on: [playtest]
        task: |
          Write the cycle-{{cycle_n}} postmortem for iteration {{iteration_tag}}.

          Read these memory keys verbatim: 'telemetry_{{iteration_tag}}' (just
          written by the playtest step) and 'goals_md' (the project's GOALS.md).
          If either is missing, fail the task — don't invent numbers.

          Structure (≤ 600 words total):
            - One-paragraph summary of what the batch did well vs. missed.
            - Per §2/§3 of GOALS.md: for EACH §3 target, report observed value
              and whether it's a hit/miss. Cite metric names verbatim from the
              contract (see src/iteration/contract.METRIC_NAMES).
            - Top 3 problems ranked by player-impact, each tied to a metric.
            - 1-2 open questions for the proposal step (not solutions).

          All metric names you mention must pass validate_goals_md — same
          vocabulary as GOALS.md. Do not invent fps, drop_rate, etc.

          Optional inputs (read if present, don't block if missing — these
          steps run in parallel with you):
            - 'player_feedback_v{{cycle_n}}' — if non-empty, weave 1-2 quoted
              themes into the problems section and tag their direction_to_proposal.
            - 'metrics_store_refresh_v{{cycle_n}}' — if present, link the
              committed dashboard.html in the summary for the human gate.

          Save to memory as artifact 'postmortem_{{iteration_tag}}'.
        output: postmortem

      # Four proposers fan out in parallel — deliberately no depends_on between
      # them. Each reads the same postmortem and pitches one change.
      - id: propose-designer
        agent: game-designer
        depends_on: [postmortem]
        task: |
          Read 'postmortem_{{iteration_tag}}' + 'goals_md' + 'mechanics_v1' from memory.
          Propose ONE mechanics-level change for cycle {{cycle_n}}+1 that targets the
          single most-impactful miss in the postmortem.

          Format (≤ 300 words):
            - Title (one line).
            - Change (what, in code-change terms — file/system, new param, removed
              behaviour, altered curve).
            - Expected metric movement: name the §2 metric(s) this should move and
              by how much (e.g. "accuracy: +0.05 on death runs").
            - Risk: what could get worse (name a §2 metric).

          Save to memory as artifact 'proposal_designer_{{iteration_tag}}'.
        output: proposal_designer

      - id: propose-ux
        agent: hud-designer
        depends_on: [postmortem]
        task: |
          Read 'postmortem_{{iteration_tag}}' + 'goals_md' + 'hud_spec_v1' from memory.
          Propose ONE HUD / flow / legibility change (HUD element placement, pause
          behavior, win/lose tone, tutorial hint, feedback signal) for cycle
          {{cycle_n}}+1 that addresses a miss in the postmortem — not a mechanics
          change, not new juice FX (that's propose-artist).

          Format identical to propose-designer (Title, Change, Expected metric
          movement, Risk). Cite §2 metrics.

          Save as artifact 'proposal_ux_{{iteration_tag}}'.
        output: proposal_ux

      - id: propose-artist
        agent: technical-artist
        depends_on: [postmortem]
        task: |
          Read 'postmortem_{{iteration_tag}}' + 'goals_md' + 'laf_brief_v1' from
          memory. Propose ONE art / feedback / readability change for cycle
          {{cycle_n}}+1 — silhouette, palette, animation, or juice FX.

          Format identical to propose-designer. Cite §2 metrics.

          Save as artifact 'proposal_artist_{{iteration_tag}}'.
        output: proposal_artist

      - id: propose-proto
        agent: frontend-developer
        depends_on: [postmortem]
        task: |
          Read 'postmortem_{{iteration_tag}}' + 'goals_md' + 'game_html_v{{cycle_n}}'
          from memory. Propose ONE code-level change (refactor, tuning, bug fix,
          perf win) for cycle {{cycle_n}}+1 addressing a miss — not a design change.

          Format identical to propose-designer. Cite §2 metrics.

          Save as artifact 'proposal_proto_{{iteration_tag}}'.
        output: proposal_proto

      - id: synthesis_gate
        type: human-gate
        depends_on: [propose-designer, propose-ux, propose-artist, propose-proto]
        review_of: propose-designer
        task: |
          Review all 4 proposals (propose-designer / propose-ux / propose-artist /
          propose-proto) against 'postmortem_{{iteration_tag}}'. Pick ONE to
          implement, request a revision on one, or reject all and halt the loop.
          The gate's approval note is passed to the implement step as the brief.

      - id: implement
        agent: frontend-developer
        depends_on: [synthesis_gate]
        task: |
          Implement the approved proposal from the synthesis_gate for cycle
          {{cycle_n}}+1. Read these memory keys BEFORE editing: the chosen
          'proposal_*_{{iteration_tag}}', 'game_html_v{{cycle_n}}', 'tech_plan_v1',
          'laf_brief_v1'.

          Apply the proposal — do not rebuild from scratch. Preserve window.__game
          shape so the next playtest bot can still drive the game.

          Save the new build to memory as artifact 'game_html_v{{cycle_n_plus_1}}'.
          Then call the `external_repo_commit` tool with:
            - repo_path = memory[`artifact_repo_path`]
            - files = [{path: "index.html", content: <the new game html>}]
            - branch = "iteration/v{{cycle_n_plus_1}}"
            - message = "iteration v{{cycle_n_plus_1}}: <one-line proposal title>"

          Do NOT use bash/git directly — the sandbox can't reach the artifact
          repo. `external_repo_commit` writes the files, stages them, and makes
          a local commit (no push). The orchestrator will relaunch the playtest
          step for cycle {{cycle_n_plus_1}} as soon as this task completes.
        output: build
