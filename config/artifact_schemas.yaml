schemas:
  concept_options_v1:
    required_fields: [directions]
    field_rules:
      directions:
        type: list
        min_items: 3
        each_requires: [pitch, core_loop, target_feel]

  mechanics_v1:
    required_fields: [player_verbs, progression, win_condition, lose_condition, signature_systems]
    field_rules:
      player_verbs:
        type: list
        min_items: 2
      signature_systems:
        type: list
        min_items: 2

  style_research_v1:
    required_fields: [references, synthesis, palette, character_design, dont_do_this]
    field_rules:
      references:
        type: list
        min_items: 4
      palette:
        type: list
        min_items: 5

  laf_brief_v1:
    required_fields: [palette, art_style, character_design, ui_direction, audio_tone, asset_references]

  tech_plan_v1:
    required_fields: [engine, file_layout, scene_list, input_model, game_loop, test_hook]

  telemetry_spec_v1:
    required_fields: [events, kpis, sink]
    field_rules:
      events:
        type: list
        min_items: 3

  game_html_v1:
    required_fields: [content]
    field_rules:
      content:
        type: string
        min_bytes: 1024

  qa_report_v1:
    required_fields: [verdict, issues, session_length_avg, death_rate_avg]
    field_rules:
      verdict:
        type: enum
        values: [PASS, FAIL, CONDITIONAL_PASS]

  postmortem_v1:
    required_fields: [goals_graded, summary, top_issues]
    field_rules:
      goals_graded:
        type: list
        min_items: 1

  proposals_v1:
    required_fields: [proposals]
    field_rules:
      proposals:
        type: list
        min_items: 3

  handoff_brief_v1:
    required_fields: [decisions, artifacts_ready, whats_next, watch_for]
    field_rules:
      decisions:
        type: string
        min_length: 50
      artifacts_ready:
        type: string
        min_length: 50
      whats_next:
        type: string
        min_length: 50
      watch_for:
        type: string
        min_length: 50

  publish_manifest_v1:
    description: "Publish manifest — tracks current and prior publish state"
    required_fields: [status, ref, published_at]
    field_rules:
      status:
        type: enum
        values: [published, failed, rollback_attempted, skipped]
      ref: {type: string}
      published_at: {type: string}

  gate_packet_gate-concept_v1:
    description: "Producer gate packet after concept approval"
    required_fields: [approved_at, artifacts_confirmed, next_phase]
    field_rules:
      approved_at: {type: string}
      artifacts_confirmed: {type: list, min_items: 1}
      next_phase: {type: string}

  gate_packet_gate-mechanics_v1:
    description: "Producer gate packet after mechanics approval"
    required_fields: [approved_at, artifacts_confirmed, next_phase]
    field_rules:
      approved_at: {type: string}
      artifacts_confirmed: {type: list, min_items: 1}
      next_phase: {type: string}

  gate_packet_gate-laf_v1:
    description: "Producer gate packet after LAF approval"
    required_fields: [approved_at, artifacts_confirmed, next_phase]
    field_rules:
      approved_at: {type: string}
      artifacts_confirmed: {type: list, min_items: 1}
      next_phase: {type: string}

  gate_packet_gate-tech_v1:
    description: "Producer gate packet after tech approval"
    required_fields: [approved_at, artifacts_confirmed, next_phase]
    field_rules:
      approved_at: {type: string}
      artifacts_confirmed: {type: list, min_items: 1}
      next_phase: {type: string}

  difficulty_tuning_v1:
    description: "Per-level difficulty tuning recommendations from telemetry"
    required_fields: [cycle_tag, recommendations, generated_at]
    field_rules:
      recommendations: {type: list, min_items: 0}
      cycle_tag: {type: string}
      generated_at: {type: string}
